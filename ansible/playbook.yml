---
- name: Deploy HRMS Application on Rocky Linux
  hosts: rocky_servers
  become: yes
  vars:
    app_name: "hrms-app"
    app_user: "hrms-app"
    app_dir: "/opt/{{ app_name }}"
    node_version: "18"
    postgres_version: "15"     # kept for reference (distro packages are used)
    db_name: "sap"
    db_user: "sap_user"
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    app_port: 5000
    client_port: 3000

  tasks:
    # ----------------------------
    # System Updates and Packages
    # ----------------------------
    - name: Update system packages
      dnf:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install EPEL repository
      dnf:
        name: epel-release
        state: present

    - name: Install basic development tools
      dnf:
        name:
          - "@Development Tools"
          - git
          - curl
          - wget
          - unzip
          - firewalld
          - nginx
          - python3-pip
          - python3-psycopg2
        state: present

    # ----------------------------
    # App User
    # ----------------------------
    - name: Create application user
      user:
        name: "{{ app_user }}"
        system: yes
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: yes

    # ----------------------------
    # Node.js + PM2
    # ----------------------------
    - name: Install NodeSource repo for Node.js {{ node_version }}
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_{{ node_version }}.x | bash -
      args:
        creates: /etc/yum.repos.d/nodesource*.repo

    - name: Install Node.js
      dnf:
        name: nodejs
        state: present

    - name: Install PM2 globally (idempotent)
      community.general.npm:
        name: pm2
        global: true
        state: present

    # ----------------------------
    # PostgreSQL
    # ----------------------------
    - name: Install PostgreSQL server and tools
      dnf:
        name:
          - postgresql-server
          - postgresql-contrib
          - postgresql-devel
        state: present

    - name: Initialize PostgreSQL database cluster (runs once)
      command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/postgresql.conf
      # must be root on Rocky
      become_user: root

    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Configure PostgreSQL local auth to md5
      lineinfile:
        path: /var/lib/pgsql/data/pg_hba.conf
        regexp: '^local\s+all\s+all\s+\S+'
        line: 'local   all             all                                     md5'
        backup: yes
      notify: restart postgresql

    - name: Ensure PostgreSQL listens on all addresses
      lineinfile:
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: "^(#\\s*)?listen_addresses\\s*=.*$"
        line: "listen_addresses = '*'"
        backup: yes
      notify: restart postgresql

    # If you need remote access from anywhere, you may also want a host rule:
    - name: Allow md5 from all hosts
      lineinfile:
        path: /var/lib/pgsql/data/pg_hba.conf
        insertafter: '^#.*IPv4 local connections:'
        line: 'host    all             all             10.0.0.0/0               md5'
      notify: restart postgresql

    # Make sure config changes are applied before schema load
    - name: Apply DB config changes now
      meta: flush_handlers

    - name: Ensure database user exists (don’t fail if already present)
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        state: present
        role_attr_flags: CREATEDB,NOSUPERUSER
        # Skip password inspection/changes if the role already exists (prevents false diffs/permission issues).
        # Set to "no" if you *do* want Ansible to manage/rotate the password.
        no_password_changes: yes
        # If you *do* want to set it on first creation only, keep it here:
        password: "{{ db_password }}"

    - name: Ensure database exists
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present

    - name: Ensure user has privileges on the database
      become: true
      become_user: postgres
      community.postgresql.postgresql_privs:
        db: "{{ db_name }}"
        type: database
        objs: ["{{ db_name }}"]   # singular form "obj" can be flaky; use "objs"
        roles: ["{{ db_user }}"]  # use list form
        privs: ALL
        state: present

    # ----------------------------
    # Application Deployment
    # ----------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Copy application files
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=client/node_modules"
          - "--exclude=client/build"
          - "--exclude=.git"
          - "--exclude=ansible"
      become_user: "{{ app_user }}"

    - name: Install backend dependencies
      community.general.npm:
        path: "{{ app_dir }}"
        production: false
      become_user: "{{ app_user }}"

    - name: Install frontend dependencies
      community.general.npm:
        path: "{{ app_dir }}/client"
        production: false
      become_user: "{{ app_user }}"

    - name: Build React application
      command: npm run build
      args:
        chdir: "{{ app_dir }}/client"
      become_user: "{{ app_user }}"

    # ----------------------------
    # Environment Configuration
    # ----------------------------
    - name: Create environment file
      template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'

    # ----------------------------
    # Database Schema Setup
    # ----------------------------
    - name: Ensure sql dir exists
      file:
        path: "{{ app_dir }}/sql"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Copy database schema files
      copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/sql/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      with_fileglob:
        - "{{ playbook_dir }}/../sql/*.sql"

    - name: Run database schema setup
      shell: >
        PGPASSWORD={{ db_password }} psql -h localhost -p 5432
        -U {{ db_user }} -d {{ db_name }} -f {{ item }}
      args:
        executable: /bin/bash
      loop:
        - "{{ app_dir }}/sql/01-sap-hcm-schema.sql"
        - "{{ app_dir }}/sql/02-sap-om-schema.sql"
        - "{{ app_dir }}/sql/03-sap-om-data.sql"
        - "{{ app_dir }}/sql/04-sap-hcm-employees.sql"
      become_user: "{{ app_user }}"
      ignore_errors: true
 #
    # ----------------------------
    # PM2 Configuration
    # ----------------------------
    - name: Create PM2 ecosystem file
      template:
        src: ecosystem.config.js.j2
        dest: "{{ app_dir }}/ecosystem.config.js"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Start application with PM2 (user session)
      command: pm2 start ecosystem.config.js
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Save PM2 process list (user session)
      command: pm2 save
      become_user: "{{ app_user }}"

    # Generate the systemd unit (once), but DO NOT execute its stdout
    - name: Check if pm2 systemd unit already exists
      stat:
        path: "/etc/systemd/system/pm2-{{ app_user }}.service"
      register: pm2_unit_stat

    - name: Run pm2 startup to create systemd unit (if missing)
      command: pm2 startup systemd -u {{ app_user }} --hp {{ app_dir }}
      when: not pm2_unit_stat.stat.exists
      register: pm2_startup

    # Override the generated unit to run foreground (fixes PID ownership refusal)
    - name: Ensure override directory exists
      file:
        path: "/etc/systemd/system/pm2-{{ app_user }}.service.d"
        state: directory
        mode: "0755"

    - name: Write systemd override to run PM2 in foreground
      copy:
        dest: "/etc/systemd/system/pm2-{{ app_user }}.service.d/override.conf"
        mode: "0644"
        content: |
          [Service]
          Type=simple
          ExecStart=
          ExecStart=/usr/bin/pm2 resurrect --no-daemon
          PIDFile=
          KillMode=process
          Restart=on-failure
          Environment=PATH=/usr/local/bin:/usr/bin:/bin
          Environment=PM2_HOME={{ app_dir }}/.pm2
          User={{ app_user }}

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable & restart pm2 service
      systemd:
        name: "pm2-{{ app_user }}"
        enabled: true
        state: restarted

    # ----------------------------
    # Nginx
    # ----------------------------
    - name: Create nginx site config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/{{ app_name }}.conf
        backup: yes
      notify: restart nginx

    # Avoid removing the main nginx.conf; manage only conf.d
    - name: Create custom nginx main config (optional override)
      template:
        src: nginx-main.conf.j2
        dest: /etc/nginx/nginx.conf
        backup: yes
      notify: restart nginx
      when: nginx_main_override | default(true) | bool

    # ----------------------------
    # Firewall
    # ----------------------------
    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Open HTTP port
      firewalld:
        port: 80/tcp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open HTTPS port
      firewalld:
        port: 443/tcp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open PostgreSQL port (optional)
      firewalld:
        port: 5432/tcp
        permanent: yes
        state: enabled
        immediate: yes

    # ----------------------------
    # SELinux
    # ----------------------------
    - name: Allow nginx to connect to network (proxy to Node)
      seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Set SELinux context for application directory (content)
      sefcontext:
        target: "{{ app_dir }}(/.*)?"
        setype: httpd_sys_content_t
        state: present

    - name: Apply SELinux context
      command: restorecon -Rv {{ app_dir }}

  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
